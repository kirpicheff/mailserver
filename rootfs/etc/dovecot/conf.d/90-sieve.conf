# Конфигурация Sieve для Dovecot 2.4

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

service managesieve {
}

protocol sieve {
  managesieve_max_line_length = 64k
  managesieve_implementation_string = dovecot
  log_path = /var/log/dovecot-sieve-errors.log
  info_log_path = /var/log/dovecot-sieve.log
}

sieve_plugins {
  sieve_extprograms = yes
}

sieve_extensions {
  vnd.dovecot.filter = yes
}

sieve_script personal {
  driver = file
  path = /data/mail/%{user | domain}/%{user | username}/sieve
  active_path = /data/mail/%{user | domain}/%{user | username}/.dovecot.sieve
}

sieve_script default {
  type = default
  driver = file
  path = /data/sieve/default.sieve
}

sieve_script before {
  type = before
  driver = file
  path = /data/sieve/before.sieve
}

sieve_filter_bin_dir = /etc/dovecot/sieve-filter
sieve_filter_exec_timeout = 120s

protocol lmtp {
  mail_plugins {
    sieve = yes
    quota = yes
  }
  log_path = /var/log/dovecot-lmtp-errors.log
  info_log_path = /var/log/dovecot-lmtp.log
}
