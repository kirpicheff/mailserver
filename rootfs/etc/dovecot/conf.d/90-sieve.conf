protocols = $protocols sieve

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

service managesieve {
}

protocol sieve {
    managesieve_max_line_length = 65536
    managesieve_implementation_string = dovecot
    log_path = /var/log/dovecot-sieve-errors.log
    info_log_path = /var/log/dovecot-sieve.log
}

plugin {
    sieve = file:/data/mail/%d/%n/.dovecot.sieve
    sieve_default = /data/sieve/default.sieve
    sieve_dir = /data/mail/%d/%n/sieve/
    sieve_global = /data/sieve/global/

    sieve_before = /data/sieve/before.sieve
    sieve_extensions = +vnd.dovecot.filter
    sieve_plugins = sieve_extprograms
    sieve_filter_bin_dir = /etc/dovecot/sieve-filter
    sieve_filter_exec_timeout = 120s
}

protocol lmtp {
    mail_plugins = $mail_plugins sieve quota
    log_path = /var/log/dovecot-lmtp-errors.log
    info_log_path = /var/log/dovecot-lmtp.log
}
