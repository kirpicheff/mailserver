# Конфигурация квот для Dovecot 2.4

quota "User quota" {
  driver = count
  quota_warning warn-100 {
    quota_storage_percentage = 100
    execute quota-exceeded {
      args = 100 %{user}
    }
  }
  quota_warning warn-90 {
    quota_storage_percentage = 90
    execute quota-warning {
      args = 90 %{user}
    }
  }
  quota_warning warn-80 {
    quota_storage_percentage = 80
    execute quota-warning {
      args = 80 %{user}
    }
  }
}

!include /etc/dovecot/dovecot-dict-sql.conf.ext

service quota-warning {
  executable = script /etc/dovecot/quota-warning.sh
  unix_listener quota-warning {
    user = postfix
    group = postfix
    mode = 0777
  }
}

service quota-exceeded {
  executable = script /etc/dovecot/quota-exceeded.sh
  unix_listener quota-exceeded {
    user = postfix
    group = postfix
    mode = 0777
  }
}
