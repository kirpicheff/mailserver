server {
    listen 80;
    server_name {{ MAIL_SERVER }} webmail.*;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate      {{ FULLCERT }};
    ssl_certificate_key  {{ KEYFILE }};
    server_name {{ MAIL_SERVER }} webmail.*;
    root /var/www/{{ DEFAULT_WEBMAIL }};
    index index.php;

    location /rspamd/ {
        proxy_pass       http://localhost:11334/;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
    }

    # Z-Push ActiveSync
    location /Microsoft-Server-ActiveSync {
        alias /var/www/z-push/index.php;
        fastcgi_pass unix:/var/run/php82-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/z-push/index.php;
        fastcgi_param HTTPS on;
    }


    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        if (!-f $document_root$fastcgi_script_name) {
            return 404;
        }

        fastcgi_pass unix:/var/run/php82-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param QUERY_STRING $query_string;
    }

    # Security for both
    location ^~ /data { deny all; }
    location ^~ /_data { deny all; }
    location ^~ /config { deny all; }
    location ^~ /temp { deny all; }
    location ^~ /logs { deny all; }
}
