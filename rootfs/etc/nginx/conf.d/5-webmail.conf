server {
    listen 80;
    server_name {{ MAIL_SERVER }} webmail.*;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    ssl_certificate      {{ FULLCERT }};
    ssl_certificate_key  {{ KEYFILE }};
    server_name {{ MAIL_SERVER }} webmail.*;

    location /rspamd/ {
        proxy_pass       http://localhost:11334/;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
    }

    # Раздача вырезанных вложений Postfix File-Link Milter
    location /attachments/ {
        alias /data/attachments/;
        autoindex off;
        add_header Content-Disposition 'attachment';

        location /attachments/.tmp/ {
            deny all;
        }

        location ~ \.(php|php5|phtml|pl|py|cgi)$ {
            deny all;
        }
    }

    # Веб-почта WallMail
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE поддержка
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 1000M;
    }
}

